# .github/workflows/build-macos-arm64.yml
name: Build Bolt for macOS (Apple Silicon)

on:
  workflow_dispatch:
  push:
    branches:
      - dev
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build-macos-arm64:
    name: Build Apple Silicon DMG
    runs-on: nscloud-macos-tahoe-arm64-12x56
    timeout-minutes: 360

    steps:
      - name: Check out macOS packaging scripts
        uses: actions/checkout@v6
        with:
          repository: ungoogled-software/ungoogled-chromium-macos
          ref: master
          path: macos-packaging

      - name: Check out Bolt core
        uses: actions/checkout@v6
        with:
          repository: A-x6/ungoogled-chromium
          ref: ${{ github.ref_name }}
          path: macos-packaging/ungoogled-chromium
          fetch-depth: 1

      - name: Prepare build scripts
        working-directory: macos-packaging
        run: cp -a .github/scripts/. .

      - name: Prepare Xcode
        working-directory: macos-packaging
        run: ./github_prepare_xcode.sh

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Set up macOS toolchain
        working-directory: macos-packaging
        run: ./github_setup_env_toolchain.sh arm64

      - name: Build and package Bolt
        working-directory: macos-packaging
        env:
          MACOS_AD_HOC_SIGNING: "1"
        run: ./build.sh arm64

      - name: Upload DMG
        uses: actions/upload-artifact@v4
        with:
          name: bolt-macos-arm64-${{ github.ref_name }}
          path: macos-packaging/build/*.dmg
          if-no-files-found: error
          retention-days: 14
