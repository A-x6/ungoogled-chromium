name: Create new empty release

on:
  push:
    tags:
      - '*'

jobs:
  build:
    name: Create Release
    permissions:
      contents: write
    runs-on: namespace-profile-tunguntgtungsahurbrowser
    steps:
      - name: Create Release
        id: create_release
        uses: actions/create-release@latest
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ github.ref_name }}
          release_name: ${{ github.ref_name }}
          draft: false
          prerelease: false
